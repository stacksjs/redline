name: Deploy

# Push to deploy: every commit on main ships the site to the shared Stacks
# Hetzner box and reconciles Cloudflare in front of it.
on:
  push:
    branches:
      - main
  # Manual re-run, for retrying a deploy without an empty commit.
  workflow_dispatch:

# One deploy at a time. Two concurrent runs would race on the same rpx fragment
# and the same DNS records; `cancel-in-progress: false` lets the in-flight one
# finish rather than abandoning a half-shipped release.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Secrets cannot be evaluated in a job-level `if`, so the gate is a step.
      # Without it this workflow goes red on every push until all three secrets
      # exist — a failing deploy that means nothing, which is the fastest way to
      # teach everyone to ignore a red main.
      - name: Check deploy credentials
        id: creds
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HCLOUD_SSH_KEY: ${{ secrets.HCLOUD_SSH_KEY }}
        run: |
          missing=""
          [ -n "$HCLOUD_TOKEN" ] || missing="$missing HCLOUD_TOKEN"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$HCLOUD_SSH_KEY" ] || missing="$missing HCLOUD_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Missing repository secrets:$missing"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.creds.outputs.configured == 'true'

      # ts-cloud is not a dependency of this project (see scripts/deploy.ts), so
      # it is cloned at deploy time.
      #
      # Deliberately OUTSIDE the workspace, which is why this is a plain clone
      # rather than actions/checkout (whose `path` cannot escape the workspace).
      # ts-cloud runs a secret scan over the tree it is about to deploy, and a
      # checkout of its own source sitting inside that tree gets scanned too:
      # its fixtures and password-shaped constants trip the scanner and the
      # deploy is blocked by seventeen findings that have nothing to do with
      # this site.
      - name: Check out ts-cloud
        if: steps.creds.outputs.configured == 'true'
        run: |
          git clone --depth 1 --branch main https://github.com/stacksjs/ts-cloud.git "$RUNNER_TEMP/ts-cloud"

      - name: Install ts-cloud dependencies
        if: steps.creds.outputs.configured == 'true'
        run: bun install
        working-directory: ${{ runner.temp }}/ts-cloud

      # The CLI runs from TypeScript source, but it imports the sibling
      # workspace packages by name and those resolve to their `dist` — which a
      # fresh clone has not built. Without this the deploy dies on "Cannot find
      # module '@ts-cloud/core'". Order matters: core's types come from
      # aws-types, so aws-types builds first. The CLI package itself needs no
      # build; Bun executes its entry directly.
      - name: Build ts-cloud workspace packages
        if: steps.creds.outputs.configured == 'true'
        working-directory: ${{ runner.temp }}/ts-cloud
        run: |
          bun run --filter '@ts-cloud/aws-types' build
          bun run --filter '@ts-cloud/core' build

      - name: Install
        if: steps.creds.outputs.configured == 'true'
        run: bun install

      # The deploy ships the built site over SSH, so the runner needs a key the
      # box authorises. Keep it to this job's filesystem — never the repo.
      - name: Configure SSH
        if: steps.creds.outputs.configured == 'true'
        env:
          HCLOUD_SSH_KEY: ${{ secrets.HCLOUD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HCLOUD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 178.105.248.188 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        if: steps.creds.outputs.configured == 'true'
        env:
          TS_CLOUD_PATH: ${{ runner.temp }}/ts-cloud
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # `bun run deploy` reads .env, which does not exist in CI — the secrets
        # above are already in the environment, so call the script directly.
        run: bun scripts/deploy.ts deploy --env production
